<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1250" width="1460" height="1250" font-family="HarmonyOS Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7A8698"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,9 L9,0 Z" fill="#7A8698"/>
    </marker>
    <marker id="ardg" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,9 L9,0 Z" fill="#1E7A4C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1460" height="1250" fill="#FFFFFF"/>

  <text x="70" y="52" font-size="23" font-weight="700" fill="#1F2329">每日知途（WisdomDaily）核心数据流图</text>
  <text x="70" y="78" font-size="13" fill="#5A6270">读路径（冷启动 10 条 SQL + 内存拼装）· 写路径（编辑即事务提交）· 初始化编排与一致性兜底（RelationalStore / SQLite）</text>

  <!-- ==================== 读路径 ==================== -->
  <rect x="70" y="110" width="1370" height="345" rx="10" fill="#EAF3FF" stroke="#BBD8F7" stroke-width="1.5"/>
  <text x="90" y="136" font-size="15" font-weight="700" fill="#1B5FA8">读路径 ｜ 冷启动加载与渲染（10 条索引查询 → 内存拼装 → 渲染）</text>

  <!-- Row 1 -->
  <rect x="88" y="155" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="112" cy="185" r="13" fill="#4A8FE7"/>
  <text x="112" y="190" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="134" y="190" font-size="13" font-weight="700" fill="#1F2329">应用启动</text>
  <text x="104" y="223" font-size="11" fill="#5A6270">EntryAbility.onCreate 发起 init()</text>
  <text x="104" y="245" font-size="11" fill="#5A6270">loadContent → Index.aboutToAppear</text>

  <rect x="430" y="155" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="454" cy="185" r="13" fill="#4A8FE7"/>
  <text x="454" y="190" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="476" y="190" font-size="13" font-weight="700" fill="#1F2329">打开数据库连接</text>
  <text x="446" y="223" font-size="11" fill="#5A6270">ScheduleDb.init（幂等 · 并发合流）</text>
  <text x="446" y="245" font-size="11" fill="#5A6270">PRAGMA → 建表 / 迁移 / 自愈</text>

  <rect x="772" y="155" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="796" cy="185" r="13" fill="#4A8FE7"/>
  <text x="796" y="190" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="818" y="190" font-size="13" font-weight="700" fill="#1F2329">loadWorkspace（4 条查询）</text>
  <text x="788" y="223" font-size="11" fill="#5A6270">semester ⋈ template · template</text>
  <text x="788" y="245" font-size="11" fill="#5A6270">slot（全量）· app_setting</text>

  <rect x="1114" y="155" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="1138" cy="185" r="13" fill="#4A8FE7"/>
  <text x="1138" y="190" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1160" y="190" font-size="13" font-weight="700" fill="#1F2329">loadSemesterCourses（6 条）</text>
  <text x="1130" y="223" font-size="11" fill="#5A6270">teacher · course · class_group</text>
  <text x="1130" y="245" font-size="11" fill="#5A6270">time_period · period_week · class_info</text>

  <line x1="398" y1="207" x2="426" y2="207" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="740" y1="207" x2="768" y2="207" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1082" y1="207" x2="1110" y2="207" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>

  <!-- wrap arrow -->
  <polyline points="1268,260 1268,288 242,288 242,304" fill="none" stroke="#7A8698" stroke-width="2" marker-end="url(#ard)"/>

  <!-- Row 2 -->
  <rect x="88" y="310" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="112" cy="340" r="13" fill="#4A8FE7"/>
  <text x="112" y="345" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="134" y="345" font-size="13" font-weight="700" fill="#1F2329">内存逐层拼装</text>
  <text x="104" y="378" font-size="11" fill="#5A6270">period_week → TimePeriod → ClassGroup</text>
  <text x="104" y="400" font-size="11" fill="#5A6270">→ Course → TeacherCourses（4 层 Map）</text>

  <rect x="430" y="310" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="454" cy="340" r="13" fill="#4A8FE7"/>
  <text x="454" y="345" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="476" y="345" font-size="13" font-weight="700" fill="#1F2329">派生状态计算</text>
  <text x="446" y="378" font-size="11" fill="#5A6270">教师下拉项 · 当前教师课表</text>
  <text x="446" y="400" font-size="11" fill="#5A6270">周次 · 周矩阵（parseDate 防偏移）</text>

  <rect x="772" y="310" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="796" cy="340" r="13" fill="#4A8FE7"/>
  <text x="796" y="345" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="818" y="345" font-size="13" font-weight="700" fill="#1F2329">课表网格渲染</text>
  <text x="788" y="378" font-size="11" fill="#5A6270">week_nums 过滤 → 绝对定位</text>
  <text x="788" y="400" font-size="11" fill="#5A6270">left = (weekday-1) × 列宽 · 字色 BT.601</text>

  <rect x="1114" y="310" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="1138" cy="340" r="13" fill="#4A8FE7"/>
  <text x="1138" y="345" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="1160" y="345" font-size="13" font-weight="700" fill="#1F2329">首屏可见</text>
  <text x="1130" y="378" font-size="11" fill="#5A6270">周视图 · 时间轴 · 周次条</text>
  <text x="1130" y="400" font-size="11" fill="#5A6270">读盘仅此一次（NFR-01 ≤ 1.5s）</text>

  <line x1="398" y1="362" x2="426" y2="362" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="740" y1="362" x2="768" y2="362" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1082" y1="362" x2="1110" y2="362" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ==================== 写路径 ==================== -->
  <rect x="70" y="470" width="1370" height="345" rx="10" fill="#FFF4E6" stroke="#F6D5A6" stroke-width="1.5"/>
  <text x="90" y="496" font-size="15" font-weight="700" fill="#A05A00">写路径 ｜ 编辑即事务提交（不再有"内存脏了但没落盘"的中间状态）</text>

  <rect x="88" y="515" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="112" cy="545" r="13" fill="#E08A2E"/>
  <text x="112" y="550" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="134" y="550" font-size="13" font-weight="700" fill="#1F2329">用户编辑并点保存</text>
  <text x="104" y="583" font-size="11" fill="#5A6270">添加课程 / 改时间段 / 换颜色</text>
  <text x="104" y="605" font-size="11" fill="#5A6270">页面调 ScheduleRepository</text>

  <rect x="430" y="515" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="454" cy="545" r="13" fill="#E08A2E"/>
  <text x="454" y="550" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="476" y="550" font-size="13" font-weight="700" fill="#1F2329">入参归一化</text>
  <text x="446" y="583" font-size="11" fill="#5A6270">normalizeWeeks 夹紧至 [1, totalWeeks]</text>
  <text x="446" y="605" font-size="11" fill="#5A6270">normalizeColor 统一 6 位色值</text>

  <rect x="772" y="515" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="796" cy="545" r="13" fill="#E08A2E"/>
  <text x="796" y="550" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="818" y="550" font-size="13" font-weight="700" fill="#1F2329">冲突预检（事务外）</text>
  <text x="788" y="583" font-size="11" fill="#5A6270">教师维度 + 班级维度两条 JOIN</text>
  <text x="788" y="605" font-size="11" fill="#5A6270">周次 IN 下推 · 节次区间走索引</text>

  <rect x="1114" y="515" width="308" height="105" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="1138" cy="545" r="13" fill="#E08A2E"/>
  <text x="1138" y="550" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1160" y="550" font-size="13" font-weight="700" fill="#1F2329">有冲突？返回详情</text>
  <text x="1130" y="583" font-size="11" fill="#5A6270">ok=false + describe() 文案</text>
  <text x="1130" y="605" font-size="11" fill="#5A6270">用户选「替换 / 仍保存 / 返回」</text>

  <line x1="398" y1="567" x2="426" y2="567" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="740" y1="567" x2="768" y2="567" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1082" y1="567" x2="1110" y2="567" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>

  <polyline points="1268,620 1268,652 242,652 242,668" fill="none" stroke="#7A8698" stroke-width="2" marker-end="url(#ard)"/>

  <!-- 事务虚线框 -->
  <rect x="82" y="662" width="662" height="131" rx="10" fill="none" stroke="#1E7A4C" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="96" y="680" font-size="11" font-weight="700" fill="#1E7A4C">runInTransaction —— 要么全成功、要么全回滚</text>

  <rect x="88" y="686" width="308" height="100" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="112" cy="715" r="13" fill="#E08A2E"/>
  <text x="112" y="720" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="134" y="720" font-size="13" font-weight="700" fill="#1F2329">事务内多表写入</text>
  <text x="104" y="750" font-size="11" fill="#5A6270">insert/update time_period → replaceWeeks</text>
  <text x="104" y="770" font-size="11" fill="#5A6270">（保存模板：template + slot 同事务）</text>
  <text x="104" y="786" font-size="11" fill="#76808F">异常 → rollback，库中数据不变</text>

  <rect x="430" y="686" width="308" height="100" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="454" cy="715" r="13" fill="#E08A2E"/>
  <text x="454" y="720" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="476" y="720" font-size="13" font-weight="700" fill="#1F2329">commit 提交落盘</text>
  <text x="446" y="750" font-size="11" fill="#5A6270">synchronous = FULL + WAL</text>
  <text x="446" y="770" font-size="11" fill="#5A6270">提交返回即已持久化</text>
  <text x="446" y="786" font-size="11" fill="#76808F">commit 抛错也只回滚一次</text>

  <rect x="772" y="686" width="308" height="100" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="796" cy="715" r="13" fill="#E08A2E"/>
  <text x="796" y="720" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="818" y="720" font-size="13" font-weight="700" fill="#1F2329">成功后更新内存</text>
  <text x="788" y="750" font-size="11" fill="#5A6270">回填自增主键 id / period_id</text>
  <text x="788" y="770" font-size="11" fill="#5A6270">页面收到 ok=true 才 pop()</text>
  <text x="788" y="786" font-size="11" fill="#76808F">失败：不弹回，保留用户输入</text>

  <rect x="1114" y="686" width="308" height="100" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <circle cx="1138" cy="715" r="13" fill="#E08A2E"/>
  <text x="1138" y="720" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="1160" y="720" font-size="13" font-weight="700" fill="#1F2329">视图自动刷新</text>
  <text x="1130" y="750" font-size="11" fill="#5A6270">@Trace 字段变更被捕获</text>
  <text x="1130" y="770" font-size="11" fill="#5A6270">依赖组件精准刷新</text>
  <text x="1130" y="786" font-size="11" fill="#76808F">无需重新查询数据库</text>

  <line x1="1082" y1="722" x2="1110" y2="722" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ==================== 初始化与一致性 ==================== -->
  <rect x="70" y="830" width="1370" height="360" rx="10" fill="#F0EBFF" stroke="#D2C4F5" stroke-width="1.5"/>
  <text x="90" y="856" font-size="15" font-weight="700" fill="#5B39A8">初始化编排 ｜ 幂等 init 的七个步骤（顺序不可调换，整体可重复执行）</text>

  <rect x="88" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="178" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">① 建库 + PRAGMA</text>
  <text x="178" y="914" font-size="10" fill="#5A6270" text-anchor="middle">getRdbStore(S1)</text>
  <text x="178" y="930" font-size="10" fill="#5A6270" text-anchor="middle">foreign_keys / WAL / FULL</text>
  <text x="178" y="948" font-size="10" fill="#5A6270" text-anchor="middle">失败不阻断（有应用层兜底）</text>

  <rect x="280" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="370" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">② 版本判断与建表</text>
  <text x="370" y="914" font-size="10" fill="#5A6270" text-anchor="middle">version=0 → 建 11 表 2 视图</text>
  <text x="370" y="930" font-size="10" fill="#5A6270" text-anchor="middle">version&lt;N → 逐级迁移</text>
  <text x="370" y="948" font-size="10" fill="#5A6270" text-anchor="middle">核心表缺失 → 自愈重建</text>

  <rect x="472" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="562" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">③ 探测旧 JSON</text>
  <text x="562" y="914" font-size="10" fill="#5A6270" text-anchor="middle">default_setting / courses</text>
  <text x="562" y="930" font-size="10" fill="#5A6270" text-anchor="middle">schedule / Class 是否还在</text>
  <text x="562" y="948" font-size="10" fill="#5A6270" text-anchor="middle">判据 = 源文件位置（幂等）</text>

  <rect x="664" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#D2C4F5" stroke-width="1.5"/>
  <text x="754" y="894" font-size="11.5" font-weight="700" fill="#5B39A8" text-anchor="middle">④ 旧数据导入（事务）</text>
  <text x="754" y="914" font-size="10" fill="#5A6270" text-anchor="middle">下标 → 主键 · 名称 → UUID</text>
  <text x="754" y="930" font-size="10" fill="#5A6270" text-anchor="middle">电话转字符串 · remake 修正</text>
  <text x="754" y="948" font-size="10" fill="#5A6270" text-anchor="middle">整体回滚，不留半截数据</text>

  <rect x="856" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="946" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">⑤ 首启播种</text>
  <text x="946" y="914" font-size="10" fill="#5A6270" text-anchor="middle">库里无学期才播种</text>
  <text x="946" y="930" font-size="10" fill="#5A6270" text-anchor="middle">默认模板 12 节 + 学期</text>
  <text x="946" y="948" font-size="10" fill="#5A6270" text-anchor="middle">教师 / 课程 / 班级 / 一节排课</text>

  <rect x="1048" y="872" width="180" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="1138" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">⑥ 指针自愈</text>
  <text x="1138" y="914" font-size="10" fill="#5A6270" text-anchor="middle">ensureRow（INSERT OR IGNORE）</text>
  <text x="1138" y="930" font-size="10" fill="#5A6270" text-anchor="middle">repairPointers 修正悬空指针</text>
  <text x="1138" y="948" font-size="10" fill="#5A6270" text-anchor="middle">保证 semester_id / teacher_id 有效</text>

  <rect x="1240" y="872" width="185" height="86" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="1332" y="894" font-size="11.5" font-weight="700" fill="#1F2329" text-anchor="middle">⑦ 归档旧 JSON</text>
  <text x="1332" y="914" font-size="10" fill="#5A6270" text-anchor="middle">搬到 legacy_json_backup/</text>
  <text x="1332" y="930" font-size="10" fill="#5A6270" text-anchor="middle">仅在导入提交成功后执行</text>
  <text x="1332" y="948" font-size="10" fill="#5A6270" text-anchor="middle">此后不再读写 JSON</text>

  <!-- 箭头串 -->
  <line x1="268" y1="915" x2="276" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="460" y1="915" x2="468" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="652" y1="915" x2="660" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="844" y1="915" x2="852" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1036" y1="915" x2="1044" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1228" y1="915" x2="1236" y2="915" stroke="#7A8698" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="90" y="992" font-size="14" font-weight="700" fill="#5B39A8">一致性兜底 ｜ 四道机制，覆盖"约束被绕过 / 版本升级 / 指针失效 / 换机迁移"</text>

  <rect x="88" y="1006" width="325" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="104" y="1029" font-size="12" font-weight="700" fill="#1F2329">级联删除双保险</text>
  <text x="104" y="1051" font-size="10.5" fill="#5A6270">PRAGMA foreign_keys = ON（每连接）</text>
  <text x="104" y="1070" font-size="10.5" fill="#5A6270">+ DAO 层显式 deleteCascade</text>
  <text x="104" y="1089" font-size="10.5" fill="#5A6270">顺序：period_week → time_period →</text>
  <text x="104" y="1106" font-size="10.5" fill="#5A6270">class_group → course → teacher / semester</text>

  <rect x="430" y="1006" width="325" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="446" y="1029" font-size="12" font-weight="700" fill="#1F2329">版本迁移（只向前）</text>
  <text x="446" y="1051" font-size="10.5" fill="#5A6270">store.version（user_version）驱动</text>
  <text x="446" y="1070" font-size="10.5" fill="#5A6270">MIGRATIONS 列表逐级执行 · 幂等</text>
  <text x="446" y="1089" font-size="10.5" fill="#5A6270">ALTER TABLE ADD COLUMN 加列</text>
  <text x="446" y="1106" font-size="10.5" fill="#5A6270">全部成功后才写版本号</text>

  <rect x="772" y="1006" width="325" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="788" y="1029" font-size="12" font-weight="700" fill="#1F2329">约束三层拦截</text>
  <text x="788" y="1051" font-size="10.5" fill="#5A6270">① 界面归一化（normalizeWeeks / Color）</text>
  <text x="788" y="1070" font-size="10.5" fill="#5A6270">② 领域对象 fromRow / toRow 再洗一遍</text>
  <text x="788" y="1089" font-size="10.5" fill="#5A6270">③ 库层 CHECK / UNIQUE / FOREIGN KEY</text>
  <text x="788" y="1106" font-size="10.5" fill="#5A6270">绕过界面写入也会被拒绝</text>

  <rect x="1114" y="1006" width="311" height="110" rx="8" fill="#FFFFFF" stroke="#DDE1E6"/>
  <text x="1130" y="1029" font-size="12" font-weight="700" fill="#1F2329">备份与恢复</text>
  <text x="1130" y="1051" font-size="10.5" fill="#5A6270">store.backup 一致性快照</text>
  <text x="1130" y="1070" font-size="10.5" fill="#5A6270">（WAL 下不能直接复制 .db 文件）</text>
  <text x="1130" y="1089" font-size="10.5" fill="#5A6270">restore 前先备份现场，可回退</text>
  <text x="1130" y="1106" font-size="10.5" fill="#5A6270">导出 JSON 走独立投影路径</text>

  <!-- 关键提示条 -->
  <rect x="88" y="1132" width="1337" height="42" rx="8" fill="#FFF9E6" stroke="#F0DFA8"/>
  <text x="104" y="1158" font-size="11.5" fill="#8A6A00" font-weight="600">关键差异：v1.0（JSON）靠"内存优先 + 四个生命周期时机兜底落盘"保证不丢数据；v2.0 让每次保存当场提交事务 —— 进程被杀只可能丢"用户还没点保存的那一步输入"，而这一步本来就该丢。</text>

  <!-- 图例 -->
  <line x1="70" y1="1222" x2="112" y2="1222" stroke="#7A8698" stroke-width="2" marker-end="url(#ar)"/>
  <text x="122" y="1227" font-size="12" fill="#5A6270">数据流方向</text>
  <text x="300" y="1227" font-size="12" fill="#1B5FA8" font-weight="600">蓝色 = 读路径</text>
  <text x="470" y="1227" font-size="12" fill="#A05A00" font-weight="600">橙色 = 写路径</text>
  <text x="640" y="1227" font-size="12" fill="#5B39A8" font-weight="600">紫色 = 初始化与一致性</text>
  <text x="880" y="1227" font-size="12" fill="#1E7A4C" font-weight="600">绿色虚线 = 事务边界</text>
  <text x="1080" y="1227" font-size="12" fill="#5A6270">存储：RelationalStore（SQLite）</text>
</svg>
